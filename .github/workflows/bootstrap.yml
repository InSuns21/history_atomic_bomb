name: Bootstrap achievement schema

on:
  push:
    branches: [feat/pages-achievement-ui]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pages-achievement-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate canonical achievement data
        run: python scripts/bootstrap_migrate.py
      - name: Validate generated site
        run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit migrated ACHIEVEMENTS.md
        run: |
          if git diff --quiet -- ACHIEVEMENTS.md; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACHIEVEMENTS.md
          git commit -m "Expand and tag achievement catalog"
          git push
