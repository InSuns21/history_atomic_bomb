name: Migrate achievements to category files

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_categories.py
      - .github/workflows/migrate-categories.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Split monolithic achievements source
        run: python scripts/migrate_categories.py

      - name: Commit migrated category sources
        run: |
          if git diff --quiet -- ACHIEVEMENTS.md achievements; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACHIEVEMENTS.md achievements
          git commit -m "Split achievements into category sources"
          git push
