name: Restore aftermath markdown spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-aftermath-spacing.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only accidentally removed blank lines
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('achievements/02_aftermath_memory.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("> 『鉄腕アトム』は「希望の原子」として通史側に残し、核戦争・反戦・生命観に直結する作品群をここでまとめる。\n| 年月日 | 実績 | タグ | 本文 |",
               "> 『鉄腕アトム』は「希望の原子」として通史側に残し、核戦争・反戦・生命観に直結する作品群をここでまとめる。\n\n| 年月日 | 実績 | タグ | 本文 |"),
              ("### 張本勲 ― 忘れたい日から、伝える日へ\n> 5歳で広島に被爆し、姉を原爆で失った張本勲は、長く被爆者であることを伏せて生きた。",
               "### 張本勲 ― 忘れたい日から、伝える日へ\n\n> 5歳で広島に被爆し、姉を原爆で失った張本勲は、長く被爆者であることを伏せて生きた。"),
              ("> 焼け跡から都市を再建し、後障害を治療し、記憶を残し、核兵器をめぐる問いを世界へ投げ返していく。\n| 年月日 | 実績 | タグ | 本文 |",
               "> 焼け跡から都市を再建し、後障害を治療し、記憶を残し、核兵器をめぐる問いを世界へ投げ返していく。\n\n| 年月日 | 実績 | タグ | 本文 |"),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'Expected pattern not found: {before[:40]}')
              text = text.replace(before, after, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-aftermath-spacing.yml
          git add achievements/02_aftermath_memory.md
          git commit -m 'Restore aftermath markdown spacing'
          git push
