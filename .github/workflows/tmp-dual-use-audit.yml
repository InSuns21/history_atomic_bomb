name: Temporary dual-use achievement audit
on:
  push:
    branches: [audit-dual-use-proliferation]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_dual_use_audit.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit audited catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACHIEVEMENTS.md
          git diff --cached --quiet || git commit -m 'Audit dual-use and proliferation achievements'
          git push
