name: Temporary audit achievements 001-010
on:
  push:
    branches: [audit-achievements-001-010]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_audit_001_010.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit audited catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACHIEVEMENTS.md
          git diff --cached --quiet || git commit -m 'Audit achievements 001-010 and restore homage context'
          git push
