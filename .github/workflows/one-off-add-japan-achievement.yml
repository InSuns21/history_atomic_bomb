name: One-off add Japan atomic research achievement

on:
  push:
    branches:
      - chatgpt/add-japan-atomic-failure-achievement
    paths:
      - .github/workflows/one-off-add-japan-achievement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch ACHIEVEMENTS.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ACHIEVEMENTS.md')
          text = p.read_text(encoding='utf-8')
          title = '**作れなかった、僕たちには無理だった**'
          if title not in text:
              lines = text.splitlines()
              insert_at = None
              for i, line in enumerate(lines):
                  if line.startswith('|1945/08/06–|**似島はもう一杯です**|'):
                      insert_at = i + 1
                      break
              if insert_at is None:
                  raise SystemExit('anchor not found')
              row = '|1945/08/08–13|**作れなかった、僕たちには無理だった**| 科学史, 原子核物理, 広島, 核兵器使用, デュアルユース |1937年、仁科芳雄らは理研で日本初のサイクロトロンを完成させ、1940年にはウラン237生成や対称核分裂を報告した。戦時下では理研の「ニ号研究」が熱拡散法によるU-235濃縮を試み、京大・荒勝文策らの研究も1944年から海軍の要請で遠心分離器設計と臨界量計算へ接続したが、いずれも兵器完成には遠く、ニ号研究参加者の中根良平は後年、必要量の濃縮ウラン製造は不可能だと分かっていたと回想している。8月6日、米国が広島で原爆を使用すると、仁科や荒勝らは現地調査へ入り、感光したX線フィルムや残留放射能などから原子爆弾であることを確認した。自分たちには作れなかった兵器を、自分たちが培った核物理学で同定することになった。タイトルは当事者の逐語発言ではない。|'
              lines.insert(insert_at, row)
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/one-off-add-japan-achievement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACHIEVEMENTS.md .github/workflows/one-off-add-japan-achievement.yml
          git commit -m 'Add 作れなかった、僕たちには無理だった achievement'
          git push origin HEAD:${{ github.ref_name }}
