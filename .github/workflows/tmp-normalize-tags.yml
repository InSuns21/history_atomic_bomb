name: Temporary tag normalization
on:
  push:
    paths:
      - 'scripts/tmp_normalize_tags.py'
      - 'scripts/tmp_patch_tag_validation.py'
      - '.github/workflows/tmp-normalize-tags.yml'
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_normalize_tags.py
      - run: python scripts/tmp_patch_tag_validation.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit normalized tags
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACHIEVEMENTS.md scripts/build_site.py
          git diff --cached --quiet || git commit -m 'Normalize achievement tag taxonomy'
          git push
