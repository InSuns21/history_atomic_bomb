name: Temporary patch and audit achievement bodies
on:
  push:
    branches: [rewrite-specific-achievement-bodies]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_validator.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit validator update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_site.py
          git diff --cached --quiet || git commit -m 'Reject boilerplate padding in achievement bodies'
          git push
