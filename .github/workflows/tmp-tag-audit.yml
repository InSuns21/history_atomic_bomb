name: Temporary tag taxonomy audit
on:
  push:
    paths:
      - 'scripts/tmp_tag_audit.py'
      - '.github/workflows/tmp-tag-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_tag_audit.py
