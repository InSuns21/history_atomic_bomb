name: Temporary finalize 180 achievement bodies
on:
  push:
    branches: [rewrite-specific-achievement-bodies]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_specific_bodies.py
      - run: python scripts/patch_two_short_bodies.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit final catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACHIEVEMENTS.md
          git diff --cached --quiet || git commit -m 'Finalize 180 achievement descriptions without filler'
          git push
