name: Temporary Hiroshima vignette restoration
on:
  push:
    branches: [restore-hiroshima-object-vignettes]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_restore_hiroshima_vignettes.py
      - run: python scripts/build_site.py --check --strict-length --strict-tags
      - name: Commit restored catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ACHIEVEMENTS.md
          git diff --cached --quiet || git commit -m 'Restore Hiroshima object vignettes'
          git push
