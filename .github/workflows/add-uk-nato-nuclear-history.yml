name: Add UK and NATO nuclear history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-uk-nato-nuclear-history.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update national and alliance nuclear history
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('ACHIEVEMENTS.md')
          text = index.read_text(encoding='utf-8')
          old = '- [各国・地域の核史](achievements/05_national_cases.md) — フランス、南アジア、北朝鮮など、各国・地域が核兵器と原子力をどう位置付けたか。'
          new = '- [各国・地域・同盟の核史](achievements/05_national_cases.md) — 英国、フランス、中国、南アジア、北朝鮮、NATOなど、各国・地域・同盟が核兵器と原子力をどう位置付けたか。'
          if old not in text:
              raise SystemExit('ACHIEVEMENTS.md category entry not found')
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          path = Path('achievements/05_national_cases.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('# 各国・地域の核史', '# 各国・地域・同盟の核史', 1)
          old_intro = '> フランス、中国、イスラエル、南アジア、北朝鮮など、各国・地域が核兵器と原子力をどう位置付けたか。'
          new_intro = '> 英国、フランス、中国、イスラエル、南アジア、北朝鮮、北大西洋条約機構（NATO）など、各国・地域・同盟が核兵器と原子力をどう位置付けたか。'
          if old_intro not in text:
              raise SystemExit('05_national_cases.md intro not found')
          text = text.replace(old_intro, new_intro, 1)

          insertion = r'''
---

## 英国 ― 独立核とは何なのか

> **自力で核保有国になった。しかし、その後の核抑止は米国との深い技術協力なしには語れない。**  
> 英国の核史は、「独立」と「同盟依存」が必ずしも反対語ではないことを示す。

| 年月日 | 実績 | タグ | 本文 |
|---|---|---|---|
|1946|**昨日まで一緒に作ってましたよね？**| 英国, 冷戦, 外交, 核拡散 |第二次世界大戦中、英国は米国・カナダと原爆開発を協力し、英国人科学者もマンハッタン計画へ参加した。ところが米国は1946年原子力法、いわゆるマクマホン法によって核兵器情報の他国への共有を厳しく制限した。戦時中に共同開発した相手から情報を得にくくなった英国は、独自の核兵器計画を進めることになる。後の米英「特別な関係」は、最初から途切れなく続いたわけではない。|
|1952/10/03|**じゃあ自分で作ります**| 英国, 核実験, 核拡散, 冷戦 |英国はオーストラリア北西沖のモンテベロ諸島でOperation Hurricaneを実施し、最初の核爆発に成功した。これにより英国は米国、ソ連に続く3番目の核爆発実施国となった。戦時中には米国と共同で原爆を開発した英国が、戦後の情報共有制限を受けて再び自国の研究・工業基盤を組み上げ、独力で核兵器能力を実証した出来事だった。|
|1957–1958|**太陽も自前で**| 英国, 核実験, 核融合, 核拡散 |英国は太平洋のマルデン島・クリスマス島周辺でOperation Grappleを実施し、熱核兵器開発を進めた。1957年から58年にかけて複数の実験を重ね、メガトン級の爆発能力を実証して第三の熱核兵器国として認識されるようになった。初期試験の設計や成功判定には技術史上の細かな議論が残るが、Grapple系列が英国の水爆能力確立と、その後の米英核協力再開に直結した点は明確である。|
|1958/07/03|**また秘密を共有しましょう**| 英国, 米国, 外交, 核兵器, 冷戦 |米英は相互防衛協定（Mutual Defence Agreement, MDA）に署名し、原子力の軍事利用に関する情報、核物質、技術などを再び広範に交換できる枠組みを作った。1946年のマクマホン法で狭められた協力は、英国が独自の核・熱核兵器能力を示した後に大きく復活した。英国は核兵器国として自立したからこそ、今度は米国との非常に深い核協力へ戻っていった。|
|1962/12–1963/04|**独立してます。ミサイルは買います。**| 英国, 米国, 核抑止, ミサイル, SLBM, 外交 |1962年のナッソー合意と翌1963年のPolaris Sales Agreementによって、英国は米国製Polaris潜水艦発射弾道ミサイルを導入する道を選んだ。核使用の政治判断と指揮統制は英国政府が自国の主権事項として維持する一方、運搬手段では米国技術へ大きく依存する構造が成立した。後継のTridentにも続くこの仕組みは、「独立核戦力」の独立が何を意味するのかを考えさせる。|
|1969/04～|**一隻は必ず海の中**| 英国, 核抑止, 原潜, SLBM, 核指揮統制 |英国は1969年4月からContinuous At-Sea Deterrence（CASD）を開始し、核武装した弾道ミサイル原子力潜水艦を少なくとも1隻、常時哨戒させる態勢を維持してきた。海中に潜伏する潜水艦は先制攻撃で一括破壊されにくく、報復能力を残す第二撃能力の中核となる。英国政府はこの核戦力の指揮統制と使用判断を独立した国家主権事項と位置付けている。|

---

## NATO ― 同盟で核を持つ

> **核兵器を共同所有しているわけではない。それでも、核抑止の利益・責任・危険を同盟で分担する。**  
> 北大西洋条約機構（NATO）の核史は、「誰の核が、誰を、誰の判断で守るのか」という拡大抑止の制度史でもある。

| 年月日 | 実績 | タグ | 本文 |
|---|---|---|---|
|1957/05/23|**通常兵器で負けそうなら核があります**| NATO, 冷戦, 核抑止, 戦術核 |NATOは戦略概念MC 14/2で「大量報復」を核抑止の中心に据えた。大規模な通常戦力を常時維持する負担を抑えつつ、ソ連・ワルシャワ条約機構からの攻撃には核兵器を含む圧倒的な反撃の可能性を示して抑止する発想だった。ただし小規模な侵攻へ通常兵器で対応する余地も残されていた。核兵器を「使うため」だけでなく、通常戦争そのものを思いとどまらせるために前面へ出した戦略である。|
|1966/12–1967/04|**核会議を始めます**| NATO, 冷戦, 核抑止, 核指揮統制, 外交 |NATOは1966年末にNuclear Planning Group（NPG）を設け、1967年4月に最初の閣僚級会合を開いた。米英など核兵器国だけで核政策を決めるのではなく、同盟国が核ドクトリン、配備、指揮統制や安全性について協議する制度を整えたことが重要だった。現在はフランスを除くNATO加盟国がNPGに参加し、核兵器を保有しない国も核抑止政策の協議へ加わる。|
|1967/12/12|**いきなり世界を終わらせないために**| NATO, 冷戦, 核抑止, 戦術核 |NATOは新たな戦略概念MC 14/3で「柔軟反応」を採用し、大量報復一辺倒から、通常戦力・戦術核・戦略核を段階的に組み合わせる考え方へ移った。背景には、限定的な危機に対して即座に全面核戦争を選ぶという二択の信頼性への疑問があった。選択肢を増やすことで抑止を強めようとした一方、どの段階で核使用へ移るのかというエスカレーション管理の難題も抱えることになった。|
|1979/12/12|**配備します。交渉もします。**| NATO, 冷戦, 核抑止, ミサイル, 軍縮・条約 |ソ連のSS-20中距離ミサイル配備に対し、NATOは「二重決定」を採択した。米国のPershing IIと地上発射巡航ミサイルを西欧へ配備する準備を進める一方、同時にソ連との軍備管理交渉を提案するという二本立てだった。「兵器を増やす決定」と「兵器を減らす交渉」が同じ政策の中に存在し、抑止による圧力と軍縮交渉を組み合わせる冷戦核外交の典型になった。|
|1983/11/07–11|**これは演習です。本当に演習です。**| NATO, 冷戦, 核抑止, 核指揮統制 |NATOの指揮所演習Able Archer 83は、通常戦から非通常戦、さらに核兵器使用へ移行する指揮・参謀手順を訓練し、新しい核兵器使用許可手続きも扱った。実部隊を動かす演習ではなかったが、ソ連側の警戒態勢との関係から、後世には「演習が実攻撃と誤認される危険」を象徴する事例として研究されている。核抑止では、こちらが演習だと知っていることと、相手がそう理解することは別問題である。|
|1960年代～現在|**核は共有します。核ボタンは共有しません。**| NATO, 米国, 核抑止, 戦術核, 核指揮統制 |NATOのnuclear sharingでは、米国が欧州に限定数のB61核爆弾を前方配備し、一部の同盟国が核任務に使用可能なDual-Capable Aircraft（DCA）や基地、通常戦力による支援を提供する。平時の核兵器は米国の管理・統制下にあり、同盟が一つの核兵器を共同所有する制度ではない。それでも非核兵器国を含む加盟国が協議・訓練・運用支援へ参加し、抑止の利益と負担を分担する仕組みになっている。|
|2010/11/19～|**核兵器がある限り、核同盟です**| NATO, 核抑止, 軍縮・条約, 外交 |NATOは2010年の戦略概念で、核兵器のない世界の条件づくりを支持すると同時に、「核兵器が存在する限りNATOは核同盟であり続ける」と明記した。現在のNATO核政策でもこの考え方は維持されている。核軍縮を目標として掲げながら、核兵器が存在する現在の安全保障環境では核抑止を維持するという立場であり、「なくしたいが、先に手放すとは言わない」という核軍縮の構造的緊張がそのまま表れている。|
'''

          marker = '\n---\n\n## 中国 ― 大躍進の横で原爆をつくる'
          if marker not in text:
              raise SystemExit('China section marker not found')
          if '## 英国 ― 独立核とは何なのか' in text or '## NATO ― 同盟で核を持つ' in text:
              raise SystemExit('UK/NATO section already exists')
          text = text.replace(marker, insertion + '\n---\n\n## 中国 ― 大躍進の横で原爆をつくる', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate generated site
        run: python scripts/build_site_v2.py --check --strict-length --strict-tags
      - name: Commit update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-uk-nato-nuclear-history.yml
          git add ACHIEVEMENTS.md achievements/05_national_cases.md
          git commit -m 'Add UK and NATO nuclear history'
          git push
